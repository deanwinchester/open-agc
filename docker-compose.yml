version: '3.8'

services:
  open-agc:
    image: ghcr.io/deanwinchester/open-agc:latest
    container_name: open-agc
    # ── 访问控制说明（v1.0.2rc18+）──────────────────────────────
    # 应用内置 IP 分层：本机免密 / 局域网密码 / 公网禁止。
    # 注意：Docker bridge 端口映射经 NAT，所有外部流量源地址都是
    # docker 网关（172.17.0.x），应用层一律按「局域网」处理——
    # 宿主机访问同样需要密码，且公网/局域网无法区分。
    # 公网禁止必须由映射面保证（见下方端口绑定），或改用 host 网络：
    #   network_mode: host   # 与裸机语义完全一致（Linux only）
    ports:
      # 默认：仅宿主机可访问（最安全；配了密码也应改为此项 + 局域网映射）
      - "127.0.0.1:8000:8000"
      # 局域网开放（先在设置页配置「局域网访问密码」再启用）：
      # 把 192.168.x.x 换成宿主机的局域网网卡地址——只绑 LAN 不绑公网
      # - "192.168.x.x:8000:8000"
      # 不要写 "8000:8000"（绑 0.0.0.0 会把服务暴露到公网）
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - AUTO_UPGRADE=true
      # 局域网访问密码（访问控制层）：config.json 未配置时把该环境变量
      # 播种进 config.json（一次性），之后判定只以 config.json 为准；
      # 已配置则忽略本变量。也可在设置页「访问控制」配置/修改。
      # - OPEN_AGC_ACCESS_PASSWORD=你的访问密码
      # - OPENAI_API_KEY=your_key_here
      # - DEFAULT_MODEL=moonshot/kimi-latest
