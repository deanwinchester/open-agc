version: '3.8'

services:
  open-agc:
    image: ghcr.io/deanwinchester/open-agc:latest
    container_name: open-agc
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - AUTO_UPGRADE=true
      # - OPENAI_API_KEY=your_key_here
      # - DEFAULT_MODEL=moonshot/kimi-latest
