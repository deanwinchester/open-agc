name: Build and Release

on:
  push:
    branches:
      - release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Create GitHub Release (runs first; other jobs depend on it) ──
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## 变更

            - 合并 `main` → `release` 自动构建
            - Docker 镜像: `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false
          make_latest: true

      # Docker Hub 的 Overview 只读 Hub 仓库自身的 description 字段，
      # 不会自动同步 GitHub README——需显式推送（用户反馈 Hub 页空白）
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/open-agc
          readme-filepath: ./README.md
        # 密钥未配置时不阻塞发布主流程
        continue-on-error: true

  # ── Docker multi-arch build (amd64 + arm64) ──
  docker:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.create-release.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/open-agc:${{ needs.create-release.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/open-agc:latest
          labels: |
            org.opencontainers.image.version=${{ needs.create-release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ── Windows exe ──
  windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install pywebview pywin32

      - name: Build with PyInstaller
        run: |
          pyinstaller open_agc.spec --clean --noconfirm --distpath dist --workpath build\work

      - name: Create ZIP package
        shell: powershell
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\Open-AGC\*" -DestinationPath "dist\Open-AGC-${ver}-Windows-x64.zip" -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/Open-AGC-*.zip

  # ── macOS DMG ──
  macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller open_agc.spec --clean --noconfirm --distpath dist --workpath build/work

      - name: Create DMG
        run: |
          APP_NAME="Open-AGC"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${APP_NAME}-${VERSION}-macOS-$(uname -m).dmg"
          DMG_DIR="dist/dmg_staging"
          rm -rf "${DMG_DIR}"
          mkdir -p "${DMG_DIR}"
          cp -R "dist/${APP_NAME}.app" "${DMG_DIR}/"
          ln -s /Applications "${DMG_DIR}/Applications"
          hdiutil create -volname "${APP_NAME}" -srcfolder "${DMG_DIR}" -ov -format UDZO "dist/${DMG_NAME}"
          rm -rf "${DMG_DIR}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/Open-AGC-*.dmg

  # ── Linux deb ──
  linux-deb:
    needs: create-release
    # PyInstaller 在 manylinux_2_28（glibc 2.28）容器内构建，使打包出的
    # libpython/*.so 链接旧 glibc，兼容 UOS/银河麒麟等 glibc 2.28 目标机
    # （此前在 ubuntu-22.04 上构建链接 glibc 2.35，目标机报 GLIBC_2.35 not found）。
    # amd64 跑 x86_64 runner + manylinux_2_28_x86_64；arm64 跑 ARM runner +
    # manylinux_2_28_aarch64，均原生编译，避免交叉编译。
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build frontend
        run: |
          npm install
          npm run build

      # 在 manylinux 容器内构建：venv 放容器 /tmp 避免污染仓库；dist/build
      # 输出经卷挂载回 runner 供后续组装。manylinux 的 cp310 与系统 .so 均链接
      # glibc 2.28，pip 也会优先选用 manylinux_2_28 / manylinux2014 wheel。
      - name: Build binaries in manylinux container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD":/src -w /src "${{ matrix.image }}" bash -c "
            set -e
            /opt/python/cp310-cp310/bin/python -m venv /tmp/build_venv
            source /tmp/build_venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller
            pip install -r requirements.txt
            pip install pywebview
            pyinstaller open_agc.spec --clean --noconfirm --distpath dist/linux --workpath build/linux
          "

      - name: Assemble deb directory
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          STAGING_DIR="dist/deb_staging/open-agc_${VERSION}_${ARCH}"

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}/DEBIAN"
          mkdir -p "${STAGING_DIR}/opt/open-agc"
          mkdir -p "${STAGING_DIR}/usr/bin"
          mkdir -p "${STAGING_DIR}/usr/share/applications"
          mkdir -p "${STAGING_DIR}/usr/share/icons/hicolor/256x256/apps"

          # PyInstaller 输出（CI 中已构建，此处内联组装，不再调用 build_deb.sh 避免二次构建）
          cp -R "dist/linux/Open-AGC/." "${STAGING_DIR}/opt/open-agc/"
          chmod +x "${STAGING_DIR}/opt/open-agc/Open-AGC"

          # 相对符号链接，使 open-agc 进入 PATH
          ln -s "../../opt/open-agc/Open-AGC" "${STAGING_DIR}/usr/bin/open-agc"

          # 图标
          cp "static/icon_rounded.png" "${STAGING_DIR}/usr/share/icons/hicolor/256x256/apps/open-agc.png"

          # Desktop entry
          cat > "${STAGING_DIR}/usr/share/applications/open-agc.desktop" <<EOF
          [Desktop Entry]
          Name=Open-AGC
          Comment=Open-AGC - General AI Agent
          Exec=/opt/open-agc/Open-AGC
          Icon=open-agc
          Terminal=false
          Type=Application
          Categories=Utility;Development;
          StartupNotify=true
          EOF

          # DEBIAN/control
          cat > "${STAGING_DIR}/DEBIAN/control" <<EOF
          Package: open-agc
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Depends: libwebkit2gtk-4.0-37, libgtk-3-0
          Maintainer: Open-AGC <dev@open-agc.local>
          Description: Open-AGC - General AI Agent
           Open-AGC is a general-purpose AI agent for daily office, research,
           development and LLM experimentation.
          EOF

          # DEBIAN/postinst
          cat > "${STAGING_DIR}/DEBIAN/postinst" <<'EOF'
          #!/bin/bash
          set -e

          chmod +x /opt/open-agc/Open-AGC || true

          if command -v update-desktop-database > /dev/null 2>&1; then
              update-desktop-database /usr/share/applications > /dev/null 2>&1 || true
          fi
          if command -v gtk-update-icon-cache > /dev/null 2>&1; then
              gtk-update-icon-cache -q /usr/share/icons/hicolor > /dev/null 2>&1 || true
          fi

          exit 0
          EOF
          chmod 755 "${STAGING_DIR}/DEBIAN/postinst"

          # DEBIAN/prerm
          cat > "${STAGING_DIR}/DEBIAN/prerm" <<'EOF'
          #!/bin/bash
          set -e

          pkill -f "/opt/open-agc/Open-AGC" > /dev/null 2>&1 || true

          exit 0
          EOF
          chmod 755 "${STAGING_DIR}/DEBIAN/prerm"

          # DEBIAN/postrm
          cat > "${STAGING_DIR}/DEBIAN/postrm" <<'EOF'
          #!/bin/bash
          set -e

          # /usr/bin/open-agc is a packaged file, removed by dpkg on remove/purge;
          # do not rm it here — the upgrade order (old postrm upgrade runs after
          # the new files are unpacked) would delete the new symlink.

          if command -v update-desktop-database > /dev/null 2>&1; then
              update-desktop-database /usr/share/applications > /dev/null 2>&1 || true
          fi

          exit 0
          EOF
          chmod 755 "${STAGING_DIR}/DEBIAN/postrm"

      - name: Build deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          # 用 xz 压缩：新版 dpkg-deb 默认 zstd，UOS/旧版 dpkg 不支持会报
          # 「对成员 control.tar.zst 使用了未知的压缩」。xz 在 Debian/UOS 上普遍可用。
          dpkg-deb --build -Zxz --root-owner-group \
            "dist/deb_staging/open-agc_${VERSION}_${ARCH}" \
            "dist/Open-AGC-${VERSION}-Linux-${ARCH}.deb"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/Open-AGC-*-Linux-*.deb
